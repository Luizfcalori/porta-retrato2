name: Render Radar Minecraft The Sift

on:
  push:
    paths:
      - '.github/workflows/radar-minecraft-the-sift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install yt-dlp edge-tts

      - name: Download official source videos and intro
        run: |
          mkdir -p work out
          yt-dlp --no-playlist --extractor-args "youtube:player_client=android" -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o "work/gameplay.%(ext)s" "https://www.youtube.com/watch?v=vBNE3bKMpu8"
          yt-dlp --no-playlist --extractor-args "youtube:player_client=android" -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o "work/reveal.%(ext)s" "https://www.youtube.com/watch?v=vq5M47synfo"
          curl -L --fail --retry 3 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8de8-820e-9ad5-ad51dcb874b6/raw?se=2026-10-01T22%3A04%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=e8165c4e-2291-52ae-8797-12ba38d8d2f0&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T21%3A02%3A27Z&ske=2026-10-02T21%3A02%3A27Z&sks=b&skv=2026-02-06&sig=f10XZmgzgjK5s/xLKBj4RLFEcdF9s99FO5ty1Ddu3H8%3D' -o work/intro.mp4
          ls -lh work

      - name: Render full video, thumbnail and shorts
        run: |
          cat > work/build.py <<'PY'
          import asyncio, subprocess
          from pathlib import Path
          import edge_tts

          W = Path("work")
          O = Path("out")
          O.mkdir(exist_ok=True)
          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          FONT_REG = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          VOICE = "pt-BR-ThalitaMultilingualNeural"
          RATE = "-3%"
          PITCH = "-2Hz"

          sections = [
              ("A PRIMEIRA NOVA DIMENSÃO EM 14 ANOS",
               "Minecraft acaba de ganhar uma das maiores novidades da sua história recente. A Mojang confirmou The Sift, uma nova dimensão que já pode ser explorada em Minecraft Dungeons 2 e que também vai chegar ao Minecraft principal. E não estamos falando de um simples bioma ou de uma atualização pequena. The Sift será a quarta dimensão oficial do universo Minecraft."),
              ("O QUE É THE SIFT?",
               "The Sift é uma dimensão vibrante, cheia de almas e conectada ao mundo por fendas misteriosas. Em Dungeons 2, essas fendas podem aparecer durante a exploração e transportar o jogador para áreas totalmente novas. A Mojang já mostrou regiões como Meadow e Carapace, com cenários bem diferentes do Overworld, do Nether e do End."),
              ("POR QUE ISSO É TÃO GRANDE?",
               "A última vez que Minecraft recebeu uma nova dimensão foi há mais de quatorze anos, quando o End passou a fazer parte do jogo. Desde então, o universo principal ficou dividido entre Overworld, Nether e End. Agora, The Sift entra oficialmente nessa lista e abre espaço para novas criaturas, estruturas, mecânicas e histórias."),
              ("DUNGEONS 2 JÁ ESTÁ DISPONÍVEL",
               "Minecraft Dungeons 2 foi lançado em vinte e nove de setembro de dois mil e vinte e seis para Steam, Xbox Series X e S, PlayStation 5, Nintendo Switch e Switch 2. Além da nova dimensão, o jogo traz um mundo interligado, novas missões, mais equipamentos e o retorno dos illagers, agora liderados pelo Illager High Council."),
              ("E NO MINECRAFT NORMAL?",
               "A parte mais importante para quem joga Minecraft Java ou Bedrock é esta: a Mojang confirmou que The Sift também vai chegar ao jogo principal no próximo ano. Durante o Minecraft Live, a empresa mostrou um primeiro vislumbre da dimensão e até uma das criaturas que vivem por lá. Então não é rumor, mod ou conceito de fã. É conteúdo oficial."),
              ("O QUE PODE MUDAR NO JOGO?",
               "Uma quarta dimensão pode mudar bastante a exploração de Minecraft. Novos portais podem significar novos materiais, inimigos, estruturas e sistemas exclusivos. A Mojang ainda não revelou todos os detalhes da versão para Java e Bedrock, então vale separar o que já foi confirmado do que ainda é especulação. Mas uma coisa é certa: The Sift é uma das maiores expansões do universo Minecraft em muitos anos."),
              ("CURTIU A NOVIDADE?",
               "E aí, você acha que The Sift tem potencial para ficar no mesmo nível do Nether e do End? Conta pra gente nos comentários. Se gostou do vídeo, deixe seu like e não esqueça de se inscrever no Radar dos Games para acompanhar mais notícias, lançamentos e novidades do mundo dos games.")
          ]

          shorts = [
              ("MINECRAFT GANHOU UMA NOVA DIMENSÃO!",
               "Depois de mais de quatorze anos, Minecraft finalmente tem uma nova dimensão oficial. Ela se chama The Sift, já apareceu em Minecraft Dungeons 2 e foi confirmada para chegar ao Minecraft Java e Bedrock no próximo ano. É a quarta dimensão, ao lado do Overworld, Nether e End. Assista ao vídeo completo no Radar dos Games."),
              ("O QUE É THE SIFT?",
               "The Sift é a nova dimensão de Minecraft. Ela é vibrante, cheia de almas e acessada por fendas misteriosas em Minecraft Dungeons 2. A Mojang já mostrou regiões como Meadow e Carapace, além de novas criaturas. E o mais importante: ela também vai chegar ao Minecraft principal."),
              ("NÃO É RUMOR: VAI CHEGAR AO MINECRAFT NORMAL",
               "Se você achou que The Sift era exclusiva de Minecraft Dungeons 2, atenção. A Mojang confirmou no Minecraft Live que a nova dimensão chega ao Minecraft Java e Bedrock no próximo ano. Pela primeira vez em mais de quatorze anos, o jogo principal vai ganhar uma quarta dimensão oficial. Siga o Radar dos Games para mais novidades.")
          ]

          def run(cmd):
              print("+", " ".join(map(str, cmd)), flush=True)
              subprocess.run([str(x) for x in cmd], check=True)

          def duration(path):
              out = subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=noprint_wrappers=1:nokey=1",str(path)
              ], text=True).strip()
              return float(out)

          def esc(s):
              return (s.replace("\\","\\\\").replace(":","\\:")
                       .replace("'","\\'").replace("%","\\%"))

          async def synth(text, out):
              await edge_tts.Communicate(text, VOICE, rate=RATE, pitch=PITCH).save(str(out))

          async def generate_tts():
              for i,(_,text) in enumerate(sections,1):
                  mp3=W/f"sec{i:02d}.mp3"; wav=W/f"sec{i:02d}.wav"
                  await synth(text,mp3)
                  run(["ffmpeg","-y","-i",mp3,"-af","loudnorm=I=-16:LRA=7:TP=-1.5",
                       "-ar","48000","-ac","2",wav])
              for i,(_,text) in enumerate(shorts,1):
                  mp3=W/f"short{i}.mp3"; wav=W/f"short{i}.wav"
                  await synth(text,mp3)
                  run(["ffmpeg","-y","-i",mp3,"-af","loudnorm=I=-16:LRA=7:TP=-1.5",
                       "-ar","48000","-ac","2",wav])

          asyncio.run(generate_tts())

          for src,out in [("gameplay.mp4","gameplay_norm.mp4"),("reveal.mp4","reveal_norm.mp4")]:
              run(["ffmpeg","-y","-i",W/src,
                   "-vf","scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30",
                   "-an","-c:v","libx264","-preset","veryfast","-crf","20","-pix_fmt","yuv420p",W/out])

          chunks=[
              ("gameplay_norm.mp4",2,24),
              ("reveal_norm.mp4",8,22),
              ("gameplay_norm.mp4",30,26),
              ("reveal_norm.mp4",34,24),
              ("gameplay_norm.mp4",58,28),
              ("reveal_norm.mp4",60,24),
              ("gameplay_norm.mp4",88,28),
              ("reveal_norm.mp4",14,26),
          ]
          chunk_files=[]
          for idx,(src,start,length) in enumerate(chunks):
              out=W/f"chunk{idx:02d}.mp4"
              fadeout=max(0.1,length-0.30)
              run(["ffmpeg","-y","-stream_loop","-1","-ss",str(start),"-i",W/src,
                   "-t",str(length),"-vf",f"fade=t=in:st=0:d=0.30,fade=t=out:st={fadeout}:d=0.30",
                   "-an","-c:v","libx264","-preset","veryfast","-crf","20","-pix_fmt","yuv420p",out])
              chunk_files.append(out)
          with open(W/"chunks.txt","w",encoding="utf-8") as f:
              for p in chunk_files: f.write(f"file '{p.resolve()}'\n")
          run(["ffmpeg","-y","-f","concat","-safe","0","-i",W/"chunks.txt","-c","copy",W/"broll.mp4"])

          with open(W/"audio.txt","w",encoding="utf-8") as f:
              for i in range(1,len(sections)+1):
                  f.write(f"file '{(W/f'sec{i:02d}.wav').resolve()}'\n")
          run(["ffmpeg","-y","-f","concat","-safe","0","-i",W/"audio.txt","-c:a","pcm_s16le",W/"narration.wav"])
          narr_dur=duration(W/"narration.wav")
          sec_durs=[duration(W/f"sec{i:02d}.wav") for i in range(1,len(sections)+1)]
          starts=[]; cur=0.0
          for d in sec_durs:
              starts.append(cur); cur+=d

          vf=[
              f"drawtext=fontfile={FONT}:text='RADAR DOS GAMES':fontcolor=white:fontsize=26:x=45:y=38:box=1:boxcolor=0x00000099:boxborderw=12",
              f"drawtext=fontfile={FONT_REG}:text='IMAGENS OFICIAIS - MINECRAFT / XBOX':fontcolor=white@0.72:fontsize=18:x=w-tw-42:y=h-th-32"
          ]
          for (title,_),st,d in zip(sections,starts,sec_durs):
              end=min(st+5.2,st+d)
              vf.append(
                  f"drawtext=fontfile={FONT}:text='{esc(title)}':fontcolor=white:fontsize=42:"
                  f"x=70:y=h-190:box=1:boxcolor=0x000000AA:boxborderw=18:enable='between(t,{st:.3f},{end:.3f})'"
              )
          vf_str=",".join(vf)
          run(["ffmpeg","-y","-stream_loop","-1","-i",W/"broll.mp4","-i",W/"narration.wav",
               "-t",f"{narr_dur:.3f}","-vf",vf_str,"-map","0:v:0","-map","1:a:0",
               "-c:v","libx264","-preset","medium","-crf","19","-pix_fmt","yuv420p","-r","30",
               "-c:a","aac","-b:a","192k","-ar","48000","-ac","2","-movflags","+faststart",W/"body.mp4"])

          run(["ffmpeg","-y","-i",W/"intro.mp4",
               "-vf","scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30",
               "-c:v","libx264","-preset","medium","-crf","19","-pix_fmt","yuv420p",
               "-c:a","aac","-b:a","192k","-ar","48000","-ac","2",W/"intro_norm.mp4"])
          with open(W/"final_list.txt","w",encoding="utf-8") as f:
              f.write(f"file '{(W/'intro_norm.mp4').resolve()}'\n")
              f.write(f"file '{(W/'body.mp4').resolve()}'\n")
          run(["ffmpeg","-y","-f","concat","-safe","0","-i",W/"final_list.txt",
               "-c:v","libx264","-preset","medium","-crf","19","-pix_fmt","yuv420p",
               "-c:a","aac","-b:a","192k","-movflags","+faststart",
               O/"Radar_dos_Games_Minecraft_The_Sift_FINAL.mp4"])

          thumb_filter=(
              "scale=1280:720,"
              "drawbox=x=0:y=0:w=1280:h=720:color=black@0.30:t=fill,"
              f"drawtext=fontfile={FONT}:text='MINECRAFT TEM':fontcolor=white:fontsize=68:x=60:y=120:box=1:boxcolor=0x00000088:boxborderw=16,"
              f"drawtext=fontfile={FONT}:text='NOVA DIMENSÃO!':fontcolor=0x69f0ff:fontsize=72:x=60:y=230:box=1:boxcolor=0x00000088:boxborderw=16,"
              f"drawtext=fontfile={FONT}:text='1ª EM +14 ANOS':fontcolor=yellow:fontsize=42:x=65:y=365:box=1:boxcolor=0x000000AA:boxborderw=12,"
              f"drawtext=fontfile={FONT}:text='RADAR DOS GAMES':fontcolor=white:fontsize=26:x=60:y=640:box=1:boxcolor=0x000000AA:boxborderw=10"
          )
          run(["ffmpeg","-y","-ss","34","-i",W/"gameplay_norm.mp4","-frames:v","1",
               "-vf",thumb_filter,"-q:v","2",O/"Minecraft_The_Sift_Thumbnail.jpg"])

          short_specs=[
              ("gameplay_norm.mp4",6,"MINECRAFT GANHOU\\nUMA NOVA DIMENSÃO!","THE SIFT • 4ª DIMENSÃO OFICIAL"),
              ("gameplay_norm.mp4",42,"O QUE É\\nTHE SIFT?","FENDAS • ALMAS • NOVAS REGIÕES"),
              ("reveal_norm.mp4",18,"VAI CHEGAR AO\\nMINECRAFT NORMAL!","JAVA + BEDROCK • CONFIRMADO")
          ]
          for i,(src,start,title,sub) in enumerate(short_specs,1):
              audio=W/f"short{i}.wav"; sd=duration(audio)
              title_e=esc(title); sub_e=esc(sub)
              filt=(
                  "[0:v]split=2[bgsrc][fgsrc];"
                  "[bgsrc]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,"
                  "boxblur=24:12,eq=brightness=-0.12[bg];"
                  "[fgsrc]scale=1020:574:force_original_aspect_ratio=decrease[fg];"
                  "[bg][fg]overlay=(W-w)/2:520[base];"
                  f"[base]drawtext=fontfile={FONT}:text='RADAR DOS GAMES':fontcolor=white:fontsize=34:"
                  "x=54:y=70:box=1:boxcolor=0x000000A0:boxborderw=12,"
                  f"drawtext=fontfile={FONT}:text='{title_e}':fontcolor=white:fontsize=62:"
                  "x=(w-text_w)/2:y=180:line_spacing=8:box=1:boxcolor=0x000000A5:boxborderw=18,"
                  f"drawtext=fontfile={FONT}:text='{sub_e}':fontcolor=0x69f0ff:fontsize=38:"
                  "x=(w-text_w)/2:y=1210:box=1:boxcolor=0x000000A5:boxborderw=14,"
                  f"drawtext=fontfile={FONT_REG}:text='Assista ao vídeo completo no canal':fontcolor=white:fontsize=34:"
                  "x=(w-text_w)/2:y=1505:box=1:boxcolor=0x00000099:boxborderw=12,"
                  f"drawtext=fontfile={FONT}:text='RADAR DOS GAMES':fontcolor=yellow:fontsize=42:"
                  "x=(w-text_w)/2:y=1570:box=1:boxcolor=0x00000099:boxborderw=12[v]"
              )
              run(["ffmpeg","-y","-stream_loop","-1","-ss",str(start),"-i",W/src,"-i",audio,
                   "-t",f"{sd:.3f}","-filter_complex",filt,"-map","[v]","-map","1:a:0",
                   "-c:v","libx264","-preset","medium","-crf","20","-pix_fmt","yuv420p","-r","30",
                   "-c:a","aac","-b:a","160k","-ar","48000","-ac","2","-movflags","+faststart",
                   O/f"Radar_dos_Games_Minecraft_The_Sift_SHORT_{i}.mp4"])

          metadata = """TÍTULO
          MINECRAFT GANHOU UMA NOVA DIMENSÃO! 😱 The Sift explicado

          DESCRIÇÃO
          Depois de mais de 14 anos, o universo Minecraft ganhou uma nova dimensão oficial: The Sift.
          Ela já pode ser explorada em Minecraft Dungeons II e a Mojang confirmou que também chega ao Minecraft Java e Bedrock no próximo ano.

          Neste vídeo do Radar dos Games:
          • O que é The Sift
          • Por que ela é a quarta dimensão oficial
          • O que muda em Minecraft Dungeons II
          • O que já foi confirmado para Java e Bedrock
          • O que ainda é especulação

          Fontes oficiais: Minecraft / Mojang Studios / Xbox.
          #Minecraft #TheSift #MinecraftDungeons2 #Mojang #RadarDosGames

          TAGS
          Minecraft, The Sift, Minecraft nova dimensão, Minecraft Dungeons II, Minecraft Dungeons 2, Mojang, Minecraft Live 2026, Minecraft Java, Minecraft Bedrock, Radar dos Games
          """
          (O/"metadata.txt").write_text(metadata,encoding="utf-8")
          print("DONE")
          for p in O.iterdir():
              print(p, p.stat().st_size)
          PY
          python work/build.py

      - name: Validate outputs
        run: |
          for f in out/*.mp4; do
            echo "==== $f ===="
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$f"
          done
          ls -lh out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: radar-minecraft-the-sift
          path: out/*
          retention-days: 7
