name: Render Radar Minecraft The Sift

on:
  push:
    paths:
      - '.github/workflows/radar-minecraft-the-sift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install render tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check edge-tts

      - name: Download official media
        run: |
          mkdir -p work out
          getimg(){ wget -q --tries=4 --timeout=30 --user-agent='Mozilla/5.0' "$1" -O "$2" || return 1; }
          getimg 'https://www.minecraft.net/content/dam/minecraftnet/games/spicewood/screenshots/MCL_Dungeons2_sift_1280x720.jpg' work/img02.jpg
          getimg 'https://www.minecraft.net/content/dam/minecraftnet/games/spicewood/key-art/MCD2_NetBlogEditorial_1170x500.jpg' work/img01.jpg || cp work/img02.jpg work/img01.jpg
          getimg 'https://www.minecraft.net/content/dam/minecraftnet/games/spicewood/key-art/dungeons2launch_4.jpg' work/img03.jpg || cp work/img02.jpg work/img03.jpg
          getimg 'https://www.minecraft.net/content/dam/minecraftnet/games/spicewood/key-art/dungeons2launch_3.jpg' work/img04.jpg || cp work/img01.jpg work/img04.jpg
          getimg 'https://www.minecraft.net/content/dam/minecraftnet/games/spicewood/key-art/dungeons2launch_1.jpg' work/img05.jpg || cp work/img02.jpg work/img05.jpg
          getimg 'https://cms-assets.xboxservices.com/assets/30/58/3058c5d6-1db0-430a-9019-bb7e71ed5bee.jpg?n=54980885_Highlight-Feature-0_Launch-01_767x400.jpg' work/img06.jpg || cp work/img03.jpg work/img06.jpg
          getimg 'https://cms-assets.xboxservices.com/assets/99/fe/99fe5439-b34a-4073-aec7-867a0ee245c3.jpg?n=54980885_Highlight-Feature-0_Launch-02_767x400.jpg' work/img07.jpg || cp work/img04.jpg work/img07.jpg
          getimg 'https://cms-assets.xboxservices.com/assets/4f/21/4f21fe5a-db83-4cda-ae0f-0748ecce8ed0.jpg?n=54980885_Highlight-Feature-0_Launch-04_767x400.jpg' work/img08.jpg || cp work/img05.jpg work/img08.jpg
          getimg 'https://cms-assets.xboxservices.com/assets/1e/3d/1e3df4c6-ca26-4616-a43e-b42fa827b465.jpg?n=54980885_Highlight-Feature-0_Launch-05_767x400.jpg' work/img09.jpg || cp work/img02.jpg work/img09.jpg
          curl --http1.1 -L --fail --retry-all-errors --retry 5 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e0d4-820e-bea0-714852f05eae/raw?se=2026-10-01T22%3A15%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=01a1258f-e830-5207-84eb-b1f587e2af14&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T21%3A51%3A00Z&ske=2026-10-02T21%3A51%3A00Z&sks=b&skv=2026-02-06&sig=mcNWwZ2OD6N/uwhEx19mPmuXysfsxrX48lE4I7CCDTI%3D' -o work/intro.mp4
          ls -lh work

      - name: Render package
        run: python scripts/radar_minecraft_build.py

      - name: Validate outputs
        run: |
          for f in out/*.mp4; do
            echo "==== $f ===="
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$f"
          done
          ls -lh out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: radar-minecraft-the-sift
          path: out/*
          retention-days: 7
