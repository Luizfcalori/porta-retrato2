name: Render Radar dos Games V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-radar-dos-games-v2.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Radar dos Games source
        uses: actions/checkout@v4
        with:
          repository: Luizfcalori/React
          ref: radar-dos-games-v2
          path: source

      - name: Install tools and natural neural voice client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip wget curl fonts-dejavu-core
          python3 -m pip install --quiet --upgrade edge-tts

      - name: Download official GTA VI screenshots
        working-directory: source/radar-dos-games-v2
        run: |
          mkdir -p assets output_v3 work_v3
          wget --timeout=60 --tries=3 https://media-rockstargames-com.akamaized.net/VI/downloads/screenshots/GTAVI_Screenshots.zip -O /tmp/gta6.zip
          unzip -q /tmp/gta6.zip -d assets
          COUNT=$(find assets -type f | wc -l)
          echo "Official files downloaded: $COUNT"
          test "$COUNT" -ge 6

      - name: Render V3 with multilingual Brazilian Portuguese voice
        working-directory: source/radar-dos-games-v2
        run: python3 build_v3.py

      - name: Inspect output
        working-directory: source/radar-dos-games-v2
        run: |
          ls -lh output_v3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output_v3/gta6-10-coisas-confirmadas-v3-humanizado.mp4
          cat output_v3/voice-info.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: radar-dos-games-gta6-v3-humanizado
          path: source/radar-dos-games-v2/output_v3/
          retention-days: 7

# trigger: humanized-multilingual-v3
